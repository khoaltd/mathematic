project:
  type: default
  output-dir: _site
  render:
    - index.qmd

format:
  revealjs:
    theme: [default, styles.scss]
    slide-number: c/t
    controls: true
    progress: true
    center: false
    transition: slide
    background-transition: fade
    width: 1280
    height: 720
    code-copy: true
    code-overflow: wrap

lang: vi
