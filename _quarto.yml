project:
  type: website
  output-dir: _site

website:
  title: "Hành trình của kẻ khờ"
  description: "Bài thuyết trình Reveal.js về giải tích hàm."
  favicon: assets/logo-dep.svg
  navbar:
    left:
      - text: "Các chương"
        href: index.qmd

format:
  html:
    theme: [cosmo, styles.scss]
    html-math-method: mathjax
    smooth-scroll: true
  revealjs:
    theme: [white, reveal.scss]
    html-math-method: katex
    include-after-body: _includes/reveal-section-header.html
    slide-level: 2
    slide-number: c/t
    controls: true
    progress: true
    hash: true
    history: true
    menu: true
    navigation-mode: linear
    transition: slide
    background-transition: fade
    center: true
    width: 1280
    height: 600
    margin: 0.06
    number-sections: false
    code-copy: true
    footer: '<a class="deck-home-link" href="../index.html">← Mục lục các chương</a><span class="footer-caption">Hành trình của kẻ khờ · Giải tích hàm</span><img class="footer-brand-logo" src="../assets/logo-dep.svg" alt="Logo">'
    chalkboard:
      buttons: true
      theme: chalkboard

lang: vi
language:
  crossref-def-title: "Định nghĩa"
  crossref-thm-title: "Định lý"
