<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Ánh xạ liên tục giữa hai không gian metric</title>
  <desc id="desc">Lân cận bán kính delta quanh x0 trong X được ánh xạ vào lân cận bán kính epsilon quanh T x0 trong Y.</desc>
  <defs>
    <marker id="map-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9 2.4 4.5z" fill="#202020"/>
    </marker>
    <marker id="radius-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#202020"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="18" fill="#fff"/>
  <circle cx="278" cy="224" r="89" fill="none" stroke="#202020" stroke-width="2.6"/>
  <circle cx="700" cy="198" r="139" fill="none" stroke="#202020" stroke-width="2.6"/>
  <path d="M328 125C395 65 494 67 588 106" fill="none" stroke="#202020" stroke-width="3.2" marker-end="url(#map-arrow)"/>
  <path d="M293 220C394 158 490 149 595 151" fill="none" stroke="#202020" stroke-width="3.2" marker-end="url(#map-arrow)"/>
  <circle cx="278" cy="224" r="6" fill="#fff" stroke="#202020" stroke-width="2"/>
  <circle cx="313" cy="185" r="5.5" fill="#202020"/>
  <circle cx="700" cy="198" r="6" fill="#fff" stroke="#202020" stroke-width="2"/>
  <circle cx="672" cy="140" r="5.5" fill="#202020"/>
  <path d="M205 192 278 224" fill="none" stroke="#202020" stroke-width="1.8" marker-start="url(#radius-arrow)" marker-end="url(#radius-arrow)"/>
  <path d="M700 198 789 90" fill="none" stroke="#202020" stroke-width="1.8" marker-start="url(#radius-arrow)" marker-end="url(#radius-arrow)"/>
  <g fill="#202020" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="270" y="260" font-size="21">x₀</text>
    <text x="315" y="180" font-size="21">x</text>
    <text x="683" y="232" font-size="21">Tx₀</text>
    <text x="682" y="133" font-size="21">Tx</text>
    <text x="438" y="83" font-size="22">T</text>
    <text x="220" y="197" font-size="19" transform="rotate(22 220 197)">δ</text>
    <text x="754" y="119" font-size="19" transform="rotate(-49 754 119)">ε</text>
    <text x="278" y="359" font-size="21" text-anchor="middle">X</text>
    <text x="700" y="371" font-size="21" text-anchor="middle">Y</text>
  </g>
</svg>
