<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Dãy hội tụ đến giới hạn</title>
  <desc id="desc">Các số hạng trên trục số tiến gần đến x. Từ một chỉ số đủ lớn trở đi, chúng nằm trong lân cận epsilon của x.</desc>
  <rect width="960" height="400" rx="20" fill="#f6faf8"/>
  <path d="M105 221H855" stroke="#7b8794" stroke-width="3"/>
  <rect x="625" y="116" width="220" height="210" fill="#c17a31" fill-opacity=".11"/>
  <path d="M625 116v210M845 116v210" stroke="#c17a31" stroke-width="2" stroke-dasharray="8 7"/>
  <g fill="#087e83">
    <circle cx="160" cy="221" r="8"/><circle cx="290" cy="221" r="8"/>
    <circle cx="405" cy="221" r="8"/><circle cx="500" cy="221" r="8"/>
    <circle cx="575" cy="221" r="8"/><circle cx="635" cy="221" r="8"/>
    <circle cx="685" cy="221" r="8"/><circle cx="725" cy="221" r="8"/>
    <circle cx="756" cy="221" r="8"/><circle cx="781" cy="221" r="8"/>
  </g>
  <circle cx="735" cy="221" r="11" fill="#c17a31"/>
  <g fill="#536273" font-family="Georgia, serif" font-size="18" text-anchor="middle">
    <text x="160" y="260">x₁</text><text x="290" y="260">x₂</text>
    <text x="405" y="260">x₃</text><text x="500" y="260">x₄</text>
    <text x="575" y="260">…</text><text x="781" y="260">xₙ</text>
  </g>
  <text x="735" y="285" fill="#a45b18" font-family="Georgia, serif" font-size="20" text-anchor="middle">x</text>
  <text x="735" y="91" fill="#a45b18" font-family="Aptos, Segoe UI, sans-serif" font-size="18" text-anchor="middle">ε-lân cận của x</text>
  <text x="480" y="360" fill="#536273" font-family="Aptos, Segoe UI, sans-serif" font-size="20" text-anchor="middle">n tăng  →  các số hạng tiến gần x</text>
</svg>
